  const p=bfs(sx,sy,(x,y)=>G.zone[y][x]&&!G.b[y][x]&&!G.it[y][x]&&!G.claim[-(y*N+x+1)]);
  if(!p){dropHand(c);return false}
  const e=p.length?p[p.length-1]:[sx,sy],dk=-(e[1]*N+e[0]+1);G.claim[dk]=c.id;c.path=p;c.task={k:'stow',tx:e[0],ty:e[1],dk,prog:0};return true}
// взять свободный инструмент нужного вида (со склада или с земли)
function tryFetch(c,sx,sy,tool){
  const p=bfs(sx,sy,(x,y)=>{const it=G.it[y][x];return it&&it.type==tool&&it.n>0&&!G.claim[y*N+x]});
  if(!p)return false;
  const e=p.length?p[p.length-1]:[sx,sy],ck=e[1]*N+e[0];G.claim[ck]=c.id;c.path=p;c.task={k:'fetch',tx:e[0],ty:e[1],tool,ck,prog:0};return true}
// рубка/добыча/грядки требуют инструмент в руке (колонист берёт его только если у него стоит нужная профессия); перенос/снабжение/крафт требуют свободную руку
function tryKind(c,sx,sy,k,pr){
  const nd=NEEDH[k];
  if(!nd)return tryKind0(c,sx,sy,k,pr);
  if(nd!='free'&&!c.profs[PROFOF[k]])return false;
  if(nd=='free'?!c.hand:(c.hand&&c.hand.type==nd))return tryKind0(c,sx,sy,k,pr);
  const h=c.hand;c.hand=null;const ok=tryKind0(c,sx,sy,k,pr);c.hand=h;
  if(!ok)return false;
  endTask(c); // задача только проверена: бронь снимаем, руку готовим
  return h?tryStow(c,sx,sy):tryFetch(c,sx,sy,nd)}
const EMK=['build','supply','wood','stone','dig','craft'];
const intr=t=>!!t&&!t.em&&['plant','water','haul','supply','craft','wood','stone','build','dig','food','idle'].includes(t.k); // эти задания можно прервать срочным
const emAvail=d=>!d.dead&&!d.noEm&&(!d.task||intr(d.task));
function emWant(k){const dc=G.dc;if(!dc)return false;return (k=='build'?dc.build[0]:k=='supply'?dc.supply[0]:k=='wood'?dc.chop[0]:k=='stone'?dc.mine[0]:k=='dig'?dc.farm[0]:dc.craft[0])>0}
// срочные задачи: профессия не важна; если есть свободный колонист нужной профессии — берёт он, иначе любой
function tryEmergency(c,sx,sy){
  for(const k of EMK){if(!emWant(k))continue;
    if(!c.profs[PROFOF[k]]&&G.cs.some(d=>d!==c&&emAvail(d)&&d.profs[PROFOF[k]]))continue;
    if(tryKind(c,sx,sy,k,0))return true}
  return false}
function preempt(c){ // срочная задача прерывает обычную работу
  if(!EMK.some(emWant))return;
  const sx=Math.round(c.x),sy=Math.round(c.y),old=c.task,op=c.path;c.task=null;c.path=[];
  if(tryEmergency(c,sx,sy)){const nt=c.task,np=c.path;c.task=old;c.path=op;endTask(c);c.task=nt;c.path=np;if(nt.ck!=null)G.claim[nt.ck]=c.id;if(nt.dk!=null)G.claim[nt.dk]=c.id}
  else{c.task=old;c.path=op}}
function think(c,night){
  const sx=Math.round(c.x),sy=Math.round(c.y);
  // 1. жажда и голод: сначала то, что хуже
  for(const n of [['wat',c.wat],['sat',c.sat]].filter(n=>n[1]<45).sort((a,b)=>a[1]-b[1]))if(n[0]=='wat'?tryDrink(c,sx,sy):tryEat(c,sx,sy))return;
  // 2. сон ночью; при энергии ≤10 колонист не работает и ждёт ночи
  if(c.hand&&TOOLS.includes(c.hand.type)){const tk=Object.keys(TOOLFOR).find(q=>TOOLFOR[q]==c.hand.type);if(!c.profs[PROFOF[tk]]&&tryStow(c,sx,sy))return} // профессия снята — инструмент не нужен
  if(night&&(c.energy<85||c.energy<=10)){if(c.hand&&tryStow(c,sx,sy))return;if(trySleep(c,sx,sy))return}
  if(c.energy<=10){if(c.hand&&tryStow(c,sx,sy))return;c.task={k:'rest',prog:0};return}
  // 3. срочные задачи («!»): выполняют все колонисты независимо от профессии, кроме освобождённых
  if(!c.noEm&&tryEmergency(c,sx,sy))return;
  // 4. обычная работа из отмеченных профессий: сначала приоритет 1, потом 2 … 5; внутри приоритета — по порядку профессий
  const order=[];for(const k of PL)if(c.profs[k]&&k!='haul')order.push(...PROF[k].j);if(c.profs.haul)order.push(...PROF.haul.j); // перенос — фоновая работа: при том же приоритете он последний, иначе при куче ягод носильщик никогда не дойдёт до рубки
  // инструмент уже в руке — сначала работа под него (при том же приоритете), чтобы не бегать на склад за каждым грузом
  if(c.hand&&TOOLS.includes(c.hand.type)){const hk=Object.keys(TOOLFOR).find(q=>TOOLFOR[q]==c.hand.type),i=order.indexOf(hk);if(i>0){order.splice(i,1);order.unshift(hk)}}
  for(let pr=1;pr<=5;pr++)for(const k of order)if(tryKind(c,sx,sy,k,pr))return;
  if(c.hand&&tryStow(c,sx,sy))return; // работы нет — возвращаем инструмент
  c.task={k:'idle',prog:0};
}

    if(k.st==0){if(k.prog<1.2)return;const p=bfs(Math.round(c.x),Math.round(c.y),(x,y)=>x==k.bx&&y==k.by);if(!p){endTask(c);return}c.path=p;k.st=1;k.prog=0;return}
